name: clothing-store

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clothing-db
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "14333:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: clothing-api
    restart: unless-stopped

    environment:
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      VnpaySettings__Enabled: ${VNPAY_ENABLED:-false}
      VnpaySettings__TmnCode: ${VNPAY_TMN_CODE:-}
      VnpaySettings__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnpaySettings__PublicBaseUrl: ${VNPAY_PUBLIC_BASE_URL:-http://localhost:4200}
      VnpaySettings__PaymentMinutes: ${VNPAY_PAYMENT_MINUTES:-15}
      VnpaySettings__OrderMinutes: ${VNPAY_ORDER_MINUTES:-30}
      Chatbot__OllamaUrl: http://ollama:11434
      Chatbot__Model: qwen3:1.7b
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ClothingStoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      # Thời hạn access token (phút). Đặt JWT_EXPIRATION_MINUTES=1 trong .env để demo refresh token.
      JwtSettings__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      # Cookie refresh token: bật Secure (trình duyệt vẫn chấp nhận trên http://localhost).
      # Truy cập qua IP/hostname khác bằng HTTP thì đặt REFRESH_COOKIE_SECURE=false.
      RefreshTokenSettings__CookieSecure: ${REFRESH_COOKIE_SECURE:-true}
      # Khoảng "ân hạn" (giây) cho 2 request refresh gần như đồng thời; đặt 0 để tắt khi demo reuse detection.
      RefreshTokenSettings__ReuseGraceSeconds: ${REFRESH_REUSE_GRACE_SECONDS:-10}
      # Tài khoản admin được tạo tự động ở lần chạy đầu (khi DB chưa có admin nào).
      AdminSeedSettings__Email: ${ADMIN_EMAIL:-}
      AdminSeedSettings__Password: ${ADMIN_PASSWORD:-}
      # Tùy chọn: Gmail + App Password để gửi mail quên mật khẩu.
      EmailSettings__SenderEmail: ${EMAIL_SENDER:-}
      EmailSettings__AppPassword: ${EMAIL_APP_PASSWORD:-}
      # Khóa HMAC cho mã khôi phục 2FA (bắt buộc, >= 32 ký tự). Đổi giá trị này => mọi mã khôi phục đã phát mất hiệu lực.
      TwoFactorSettings__RecoveryCodePepper: ${TWO_FACTOR_RECOVERY_PEPPER}
      # CAPTCHA Cloudflare Turnstile cho đăng nhập/đăng ký. Bật mà thiếu secret thì API không khởi động.
      TurnstileSettings__SecretKey: ${TURNSTILE_SECRET_KEY}
      # Chỉ đặt false khi dev/test (mỗi lần khởi động sẽ ghi log Warning "CAPTCHA đang TẮT").
      TurnstileSettings__Enabled: ${TURNSTILE_ENABLED:-true}
      # CHỈ DÙNG ĐỂ KIỂM THỬ: trỏ tới địa chỉ không truy cập được (vd http://10.255.255.1/) để giả lập
      # mất mạng ra Cloudflare (register bị chặn, login vẫn cho qua). Bình thường KHÔNG đặt biến này.
      TurnstileSettings__VerifyUrl: ${TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}

    ports:
      - "8080:8080"

    volumes:
      - uploads_data:/app/wwwroot/uploads
      - dataprotection_data:/root/.aspnet/DataProtection-Keys
      - ./Logs:/app/Logs

    depends_on:
      db:
        condition: service_healthy

  # AI chạy trên máy hiện tại, không dùng Ollama Cloud hoặc API trả phí.
  # Không publish cổng Ollama ra Internet; chỉ API truy cập qua mạng Docker.
  ollama:
    image: ollama/ollama:latest
    container_name: clothing-ollama
    restart: unless-stopped
    gpus: all
    mem_limit: 3g
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      # Mặc định: repo frontend nằm cạnh repo backend (cùng thư mục cha).
      # Có thể đổi bằng biến FRONTEND_PATH trong file .env.
      context: ${FRONTEND_PATH:-../shop-clothing-ui}
      dockerfile: Dockerfile

    container_name: clothing-frontend
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver_data:
  uploads_data:
  dataprotection_data:
  ollama_data:
