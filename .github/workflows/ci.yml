name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ClothingAPI.slnx

      - name: Build
        run: dotnet build ClothingAPI.slnx --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/ClothingAPI.UnitTests -c Release --no-build --logger "console;verbosity=normal" --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration tests
        if: always()
        run: dotnet test tests/ClothingAPI.IntegrationTests -c Release --no-build --logger "console;verbosity=normal" --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:CoverageReport -reporttypes:"Html;TextSummary"
          cat CoverageReport/Summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            CoverageReport
            TestResults/*.trx
